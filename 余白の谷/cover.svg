<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3ead3"/>
      <stop offset="0.6" stop-color="#e9dcbc"/>
      <stop offset="1" stop-color="#d9c79f"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#7a5a2e" stop-opacity="0"/>
      <stop offset="1" stop-color="#7a5a2e" stop-opacity="0.35"/>
    </radialGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f8fb3"/>
      <stop offset="1" stop-color="#3d6f97"/>
    </linearGradient>
    <filter id="blur18" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="blur4">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="mapClip">
      <rect x="40" y="250" width="520" height="520"/>
    </clipPath>
  </defs>

  <!-- 紙 -->
  <rect width="600" height="900" fill="url(#paper)"/>
  <rect width="600" height="900" fill="url(#vignette)"/>

  <!-- 外枠(地図の図郭) -->
  <rect x="22" y="22" width="556" height="856" fill="none" stroke="#5b4427" stroke-width="2"/>
  <rect x="30" y="30" width="540" height="840" fill="none" stroke="#5b4427" stroke-width="0.8"/>

  <!-- 地図面 -->
  <g clip-path="url(#mapClip)">
    <rect x="40" y="250" width="520" height="520" fill="#e6dcbf"/>
    <!-- 方眼 -->
    <g stroke="#a8916a" stroke-width="0.6" opacity="0.5">
      <line x1="105" y1="250" x2="105" y2="770"/><line x1="170" y1="250" x2="170" y2="770"/>
      <line x1="235" y1="250" x2="235" y2="770"/><line x1="300" y1="250" x2="300" y2="770"/>
      <line x1="365" y1="250" x2="365" y2="770"/><line x1="430" y1="250" x2="430" y2="770"/>
      <line x1="495" y1="250" x2="495" y2="770"/>
      <line x1="40" y1="315" x2="560" y2="315"/><line x1="40" y1="380" x2="560" y2="380"/>
      <line x1="40" y1="445" x2="560" y2="445"/><line x1="40" y1="510" x2="560" y2="510"/>
      <line x1="40" y1="575" x2="560" y2="575"/><line x1="40" y1="640" x2="560" y2="640"/>
      <line x1="40" y1="705" x2="560" y2="705"/>
    </g>
    <!-- 左の山(等高線) -->
    <g fill="none" stroke="#6f8a5a" stroke-width="1.4">
      <path d="M40,300 C90,280 150,300 160,350 C172,410 120,470 40,480" fill="#b9c79a" fill-opacity="0.55"/>
      <path d="M40,320 C80,305 128,322 136,360 C144,404 104,446 40,452"/>
      <path d="M40,342 C70,332 104,344 110,370 C116,398 88,424 40,428"/>
      <path d="M40,364 C60,358 80,366 84,382 C88,398 66,408 40,408"/>
      <path d="M40,560 C110,540 170,580 160,650 C150,720 90,760 40,770" fill="#b9c79a" fill-opacity="0.55"/>
      <path d="M40,586 C92,572 136,600 130,652 C124,704 80,734 40,742"/>
      <path d="M40,612 C74,604 104,624 100,656 C96,690 70,706 40,712"/>
    </g>
    <!-- 右の山(等高線) -->
    <g fill="none" stroke="#6f8a5a" stroke-width="1.4">
      <path d="M560,270 C500,262 440,300 446,360 C452,420 510,452 560,456" fill="#b9c79a" fill-opacity="0.55"/>
      <path d="M560,292 C514,288 470,318 474,362 C478,408 522,430 560,432"/>
      <path d="M560,316 C528,314 500,336 502,366 C504,396 532,410 560,410"/>
      <path d="M560,540 C490,530 430,580 440,650 C450,716 510,750 560,760" fill="#b9c79a" fill-opacity="0.55"/>
      <path d="M560,566 C506,560 466,596 472,648 C478,698 522,726 560,732"/>
      <path d="M560,594 C526,592 500,616 504,650 C508,684 534,700 560,704"/>
    </g>
    <!-- 菩提樹の記号(地図の広葉樹記号) -->
    <g fill="none" stroke="#5c7a4a" stroke-width="1.2">
      <circle cx="78" cy="510" r="6"/><line x1="78" y1="516" x2="78" y2="523"/>
      <circle cx="104" cy="530" r="6"/><line x1="104" y1="536" x2="104" y2="543"/>
      <circle cx="520" cy="490" r="6"/><line x1="520" y1="496" x2="520" y2="503"/>
      <circle cx="496" cy="512" r="6"/><line x1="496" y1="518" x2="496" y2="525"/>
    </g>

    <!-- 余白(抹消された区画、霧のように白い) -->
    <path d="M190,250 C260,262 340,252 410,250 C430,320 450,400 430,470 C412,540 440,610 420,680 C400,730 330,760 260,770 C220,700 180,640 200,570 C214,510 172,450 186,380 C196,330 176,290 190,250 Z" fill="#fbf8f0" filter="url(#blur18)"/>
    <path d="M214,262 C270,272 340,262 396,262 C410,330 428,400 410,466 C394,536 420,600 402,668 C386,716 326,742 270,752 C238,692 204,636 222,568 C236,508 196,452 208,384 C218,334 200,296 214,262 Z" fill="#fdfbf6" filter="url(#blur4)"/>

    <!-- 霧の中を通る測量の三角形(百八十一度の三角) -->
    <g stroke="#8a6d45" stroke-width="1.1" stroke-dasharray="5 5" fill="none" opacity="0.7">
      <polygon points="262,360 368,412 286,520"/>
    </g>
    <g fill="#8a6d45" opacity="0.75">
      <polygon points="262,352 256,364 268,364"/>
      <polygon points="368,404 362,416 374,416"/>
      <polygon points="286,512 280,524 292,524"/>
    </g>

    <!-- 川(水図は消されていない) -->
    <path d="M318,250 C300,300 336,340 322,390 C308,440 284,470 300,520 C316,570 344,600 326,650 C312,690 290,720 300,770" fill="none" stroke="url(#river)" stroke-width="7" stroke-linecap="round"/>
    <path d="M318,250 C300,300 336,340 322,390 C308,440 284,470 300,520 C316,570 344,600 326,650 C312,690 290,720 300,770" fill="none" stroke="#cfe2ef" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

    <!-- 街道(橋の手前で途切れる) -->
    <path d="M40,742 C80,730 120,716 150,700 C176,686 196,676 214,668" fill="none" stroke="#8b5a2b" stroke-width="5" stroke-linecap="butt"/>
    <path d="M40,742 C80,730 120,716 150,700 C176,686 196,676 214,668" fill="none" stroke="#e6dcbf" stroke-width="1.6" stroke-dasharray="7 6"/>
    <!-- 途切れの印 -->
    <line x1="218" y1="656" x2="212" y2="680" stroke="#8b5a2b" stroke-width="2"/>
  </g>

  <!-- 地図面の枠 -->
  <rect x="40" y="250" width="520" height="520" fill="none" stroke="#5b4427" stroke-width="1.6"/>
  <!-- 図郭の目盛り -->
  <g stroke="#5b4427" stroke-width="1">
    <line x1="105" y1="244" x2="105" y2="250"/><line x1="170" y1="244" x2="170" y2="250"/>
    <line x1="235" y1="244" x2="235" y2="250"/><line x1="300" y1="244" x2="300" y2="250"/>
    <line x1="365" y1="244" x2="365" y2="250"/><line x1="430" y1="244" x2="430" y2="250"/>
    <line x1="495" y1="244" x2="495" y2="250"/>
    <line x1="105" y1="770" x2="105" y2="776"/><line x1="170" y1="770" x2="170" y2="776"/>
    <line x1="235" y1="770" x2="235" y2="776"/><line x1="300" y1="770" x2="300" y2="776"/>
    <line x1="365" y1="770" x2="365" y2="776"/><line x1="430" y1="770" x2="430" y2="776"/>
    <line x1="495" y1="770" x2="495" y2="776"/>
  </g>

  <!-- 少女(測桿を持って途切れた道の先に立つ) -->
  <g transform="translate(176,606)">
    <ellipse cx="14" cy="64" rx="18" ry="4" fill="#5b4427" opacity="0.25"/>
    <!-- 測桿 -->
    <rect x="30" y="-6" width="3" height="70" fill="#7a4a24"/>
    <rect x="30" y="2" width="3" height="8" fill="#c0392b"/>
    <rect x="30" y="18" width="3" height="8" fill="#c0392b"/>
    <!-- 外套 -->
    <path d="M4,20 C6,14 22,14 24,20 L30,58 C20,62 8,62 -2,58 Z" fill="#2f4a5e"/>
    <!-- 腕 -->
    <path d="M22,24 C26,26 29,28 31,30" stroke="#2f4a5e" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- 頭と髪 -->
    <circle cx="14" cy="9" r="8" fill="#f0d2b0"/>
    <path d="M6,8 C6,0 22,-2 23,8 C22,4 18,3 14,3 C10,3 7,5 6,8 Z" fill="#4a3524"/>
    <path d="M6,8 C4,14 6,18 8,20" stroke="#4a3524" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- 脚 -->
    <rect x="7" y="58" width="4" height="8" fill="#3b2a1c"/>
    <rect x="16" y="58" width="4" height="8" fill="#3b2a1c"/>
  </g>

  <!-- 地図の注記(欄外風) -->
  <text x="48" y="792" font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif" font-size="13" fill="#5b4427" letter-spacing="1">第四北図　区画十七　抹消</text>
  <text x="552" y="792" font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif" font-size="13" fill="#5b4427" text-anchor="end" opacity="0.55" letter-spacing="1">担当測図官　エダ・ハルシュ</text>
  <!-- 川の名前(消えずに残る) -->
  <text x="344" y="560" writing-mode="tb" font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif" font-size="14" fill="#3d6f97" letter-spacing="4">リンデ川</text>

  <!-- タイトル -->
  <text x="300" y="152" font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif" font-size="88" font-weight="700" fill="#2a3442" text-anchor="middle" letter-spacing="10">余白の谷</text>
  <line x1="120" y1="178" x2="480" y2="178" stroke="#5b4427" stroke-width="1"/>
  <text x="300" y="214" font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif" font-size="21" fill="#3b3226" text-anchor="middle" letter-spacing="2">見習い測図士と、地図から消された故郷の謎</text>
  <text x="300" y="60" font-family="'Yu Gothic','Hiragino Sans','Noto Sans JP',sans-serif" font-size="14" fill="#5b4427" text-anchor="middle" letter-spacing="4">異世界ファンタジー／謎解き</text>

  <!-- 全10話・完結 -->
  <g transform="translate(214,816)">
    <rect width="172" height="38" rx="3" fill="#2a3442"/>
    <rect x="3" y="3" width="166" height="32" rx="2" fill="none" stroke="#e9dcbc" stroke-width="0.8"/>
    <text x="86" y="26" font-family="'Yu Gothic','Hiragino Sans','Noto Sans JP',sans-serif" font-size="18" font-weight="700" fill="#f3ead3" text-anchor="middle" letter-spacing="2">全10話・完結</text>
  </g>
</svg>
